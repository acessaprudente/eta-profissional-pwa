<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ETA Professional PWA</title>

<meta name="description" content="Sistema Profissional para Operação de Estações de Tratamento de Água">

<meta name="theme-color" content="#1565C0">

<meta name="mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-status-bar-style" content="default">

<meta name="apple-mobile-web-app-title" content="ETA Professional">

<link rel="manifest" href="manifest.json">

<link rel="icon" href="css/icon.png">

<link rel="apple-touch-icon" href="css/icon.png">

<link rel="stylesheet" href="css/style.css">

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

</head>

<body>

<div class="layout">

<header class="topbar">

<div class="logo">

💧 ETA Professional

</div>

<div class="top-info">

<div id="statusSistema">

🟢 Online

</div>

<div id="dataHora">

--/--/---- --:--

</div>

</div>

</header>

<div class="principal">

<aside class="sidebar">

<button data-modulo="dashboard">

🏠 Dashboard

</button>

<button data-modulo="pac">

🧪 PAC Férrico

</button>

<button data-modulo="cal">

🧂 Cal Hidratada

</button>

<button data-modulo="polimero">

🧬 Polímero

</button>

<button data-modulo="balanco">

⚖️ Balanço de Massa

</button>

<button data-modulo="jar">

🧪 Jar Test

</button>

<button data-modulo="sedimentacao">

💧 Sedimentação

</button>

<hr>

<button id="btnPDF">

📄 Exportar PDF

</button>

<button id="btnExcel">

📊 Exportar Excel

</button>

</aside>

<main id="conteudo" class="conteudo">

<div class="loading">

<h2>

Bem-vindo ao ETA Professional

</h2>

<p>

Carregando sistema...

</p>

</div>

</main>

</div>

<footer class="rodape">

<div>

ETA Professional Beta 1.0

</div>

<div>

GitHub Pages | PWA | Offline

</div>

<div>

<span id="versao">

Versão Alpha 1

</span>

</div>

</footer>

</div>

<script type="module" src="js/app.js"></script>

<script>

function atualizarRelogio(){

const agora=new Date();

document.getElementById("dataHora").innerHTML=

agora.toLocaleDateString("pt-BR")+" "+agora.toLocaleTimeString("pt-BR");

}

setInterval(atualizarRelogio,1000);

atualizarRelogio();

window.addEventListener("online",()=>{

document.getElementById("statusSistema").innerHTML="🟢 Online";

});

window.addEventListener("offline",()=>{

document.getElementById("statusSistema").innerHTML="🔴 Offline";

});

</script>

</body>

</html>
